name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Offline discovery / manifest / CLI tests
        run: python tests/test_offline.py

      - name: Local HTTP download tests
        run: python tests/test_download_local.py

      - name: CLI smoke test
        run: |
          python -m docsync --help
          python -m docsync sources
